services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${MOBILITY_POSTGRES_DB:-mobility}
      POSTGRES_USER: ${MOBILITY_POSTGRES_USER:-mobility}
      POSTGRES_PASSWORD: ${MOBILITY_POSTGRES_PASSWORD:?Run python3 scripts/setup_local_env.py first}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0
    environment:
      DATABASE_URL: postgresql+psycopg://${MOBILITY_POSTGRES_USER:-mobility}:${MOBILITY_POSTGRES_PASSWORD:?Set MOBILITY_POSTGRES_PASSWORD}@postgres:5432/${MOBILITY_POSTGRES_DB:-mobility}
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
