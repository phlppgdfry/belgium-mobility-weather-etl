name: Scheduled pipeline

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install .
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice title=ETL skipped::No DATABASE_URL secret is configured. Add one to the production environment to enable scheduled loads."
            exit 0
          fi
          mobility-etl
