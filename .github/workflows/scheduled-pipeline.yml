name: Scheduled pipeline

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install .
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: mobility-etl
