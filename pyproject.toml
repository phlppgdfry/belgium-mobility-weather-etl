[project]
name = "mobility-etl"
version = "0.1.0"
description = "Production-style ETL pipeline combining Belgian city weather and mobility demand signals."
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "prefect>=3.0,<4", "psycopg[binary]>=3.2,<4", "requests>=2.32,<3", "sqlalchemy>=2.0,<3"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.38,<2", "plotly>=5.24,<6"]
dev = ["pytest>=8.3,<9", "ruff>=0.6,<1"]

[project.scripts]
mobility-etl = "mobility_etl.flow:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

